<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay3Cents 的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 尽早套用已保存的设置，避免刷新时闪一下 -->
  <script>
    try {
      if (localStorage.getItem("pay3cents-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
      // 触摸设备上点过「仍要继续」，就放行桌面
      if (localStorage.getItem("pay3cents-force-desktop") === "1") {
        document.documentElement.classList.add("force-desktop");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 触摸设备提示（软拦截）：只在「以触摸为主」的设备上显示，可用下面的按钮强制进入 -->
  <div class="mobile-tip" id="mobile-tip">
    <div class="mt-card">
      <div class="mt-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/>
          <path d="M8.5 20.5h7M12 17.5v3"/>
        </svg>
      </div>
      <h1>请在电脑上访问</h1>
      <p>这个博客是一个「电脑桌面」，需要鼠标才能正常操作。<br />手机上很多功能用不了。</p>
      <div class="mt-url">https://icent-f.github.io/</div>
      <button class="mt-continue" id="mt-continue" type="button">仍要继续（体验可能不佳）</button>
    </div>
  </div>

  <!-- 锁屏：页面打开时出现一次，点 Login 进入桌面 -->
  <div class="lockscreen" id="lockscreen">
    <div class="lock-inner">
      <div class="lock-avatar"><img src="assets/avatar.png" alt="头像" /></div>
      <div class="lock-name">Pay3Cents</div>
      <button class="lock-btn" id="lock-login" type="button" autofocus>Login</button>
    </div>
  </div>

  <div id="desktop" class="desktop">
    <!-- 壁纸层（真实图片，可直接替换 assets/wallpaper.jpg） -->
    <div class="wallpaper" aria-hidden="true"></div>

    <!-- 左侧：鼠标移过去弹出的侧边栏 -->
    <nav class="left-rail" id="left-rail">
      <div class="rail-grip">›</div>
      <div class="rail-panel" id="rail-panel"><!-- 由 JS 填充 --></div>
    </nav>

    <!-- 桌面小组件（毛玻璃） -->
    <div class="widgets-col">
      <section class="widget widget-welcome">
        <button class="mode-toggle" id="mode-toggle" type="button" title="切换到深色模式">
          <span class="mt-label" id="mode-toggle-label">浅色模式</span>
        </button>
        <div class="w-title">欢迎来到我的博客</div>
        <div class="w-sub">— Pay3Cents</div>
      </section>
      <section class="widget widget-clock">
        <div class="w-time" id="widget-time">--:--</div>
        <div class="w-week" id="widget-week">---</div>
        <div class="w-date" id="widget-date">----/--/--</div>
      </section>
    </div>

    <!-- 右半边：桌面图标 / 快捷方式区 -->
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- 窗口容器 -->
    <div id="windows" class="windows"></div>

    <!-- 底部任务栏（Win11 风格：居中图标 + 亚克力 + 系统托盘） -->
    <div class="taskbar">
      <div class="tb-center">
        <button class="tb-app" id="start-btn" title="开始">
          <img src="assets/icons/start.svg" alt="开始" />
        </button>
        <div class="tb-pinned" id="tb-pinned"><!-- 由 JS 填充：侧边栏的快捷图标 --></div>
        <div class="taskbar-windows" id="taskbar-windows"></div>
      </div>
      <div class="taskbar-right">
        <span class="tray-ico" title="网络">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 18.5a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Zm0-6.1c1.5 0 2.9.6 3.9 1.5l1.3-1.4a7.6 7.6 0 0 0-10.4 0l1.3 1.4c1-.9 2.4-1.5 3.9-1.5Zm0-4c2.6 0 5 1 6.8 2.7l1.3-1.4A11.6 11.6 0 0 0 12 6.4c-3.3 0-6.3 1.3-8.5 3.4l1.3 1.4A9.6 9.6 0 0 1 12 8.4Z"/></svg>
        </span>
        <span class="tray-ico" title="音量">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h3.5L12 19V5L7.5 9H4Zm11.5 3a4.5 4.5 0 0 0-1.8-3.6l-1 1.2c.8.6 1.3 1.5 1.3 2.4s-.5 1.8-1.3 2.4l1 1.2a4.5 4.5 0 0 0 1.8-3.6Z"/></svg>
        </span>
        <span class="tray-ico" title="电池">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="9" width="11" height="6" rx="1"/><rect x="20.4" y="10" width="1.8" height="4" rx="1"/></svg>
        </span>
        <span class="taskbar-clock" id="taskbar-clock"></span>
      </div>
    </div>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/content.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
