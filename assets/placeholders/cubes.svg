<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="马卡龙色方块建筑占位图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe3dc"/>
      <stop offset="100%" stop-color="#cfd6cd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- 方块楼群 -->
  <g>
    <rect x="60"  y="180" width="150" height="270" rx="10" fill="#e59fb3"/>
    <rect x="90"  y="230" width="90"  height="30"  rx="4" fill="#f6d9e1"/>
    <rect x="90"  y="290" width="90"  height="30"  rx="4" fill="#f6d9e1"/>
    <rect x="90"  y="350" width="90"  height="30"  rx="4" fill="#f6d9e1"/>

    <rect x="240" y="110" width="180" height="340" rx="10" fill="#e8d181"/>
    <rect x="275" y="150" width="110" height="34" rx="4" fill="#f6ebc8"/>
    <rect x="275" y="210" width="110" height="34" rx="4" fill="#f6ebc8"/>
    <rect x="275" y="270" width="110" height="34" rx="4" fill="#f6ebc8"/>
    <rect x="275" y="330" width="110" height="34" rx="4" fill="#f6ebc8"/>

    <rect x="450" y="160" width="160" height="290" rx="10" fill="#9cc4b0"/>
    <rect x="485" y="210" width="90"  height="30"  rx="4" fill="#d6e6de"/>
    <rect x="485" y="270" width="90"  height="30"  rx="4" fill="#d6e6de"/>
    <rect x="485" y="330" width="90"  height="30"  rx="4" fill="#d6e6de"/>

    <rect x="640" y="200" width="150" height="250" rx="10" fill="#9a86c8"/>
    <rect x="672" y="250" width="86"  height="28"  rx="4" fill="#ddd3f0"/>
    <rect x="672" y="308" width="86"  height="28"  rx="4" fill="#ddd3f0"/>
    <rect x="672" y="366" width="86"  height="28"  rx="4" fill="#ddd3f0"/>
  </g>
  <!-- 窗户亮灯 -->
  <circle cx="330" cy="250" r="10" fill="#fff" opacity=".8"/>
  <circle cx="330" cy="320" r="10" fill="#fff" opacity=".55"/>
  <circle cx="330" cy="390" r="10" fill="#fff" opacity=".3"/>
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a7b85">把这里替换成你的照片吧</text>
</svg>
